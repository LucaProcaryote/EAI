# The FHIR repository for Mini-Hospital 2026.
#
#   docker compose up -d
#   open http://localhost:8080          (the HAPI web console)
#   curl http://localhost:8080/fhir/metadata
#
# This is the real HAPI FHIR JPA server, not a mock: students get a
# spec-complete R4 API with proper search parameters, _include, history,
# validation and a capability statement. Standing up the genuine article is
# less work than faking a convincing subset, and far more useful.
name: mini-hospital-fhir

services:
  fhir-db:
    image: postgres:16-alpine
    container_name: mini-hospital-fhir-db
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      # Fictive data on a classroom network. Change it for anything else.
      POSTGRES_PASSWORD: hapi
    volumes:
      - fhir-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  fhir:
    image: hapiproject/hapi:v7.4.0
    container_name: mini-hospital-fhir
    depends_on:
      fhir-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fhir-db:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: hapi
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect

      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_SERVER_ADDRESS: http://localhost:8080/fhir
      # Update-as-create: the mini-hospital owns stable identifiers already,
      # and PUT Patient/pat-001 keeping that id is what lets references
      # resolve across the applications and the FHIR server.
      HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES: "true"
      HAPI_FHIR_ENFORCE_REFERENTIAL_INTEGRITY_ON_WRITE: "false"
      HAPI_FHIR_ENFORCE_REFERENTIAL_INTEGRITY_ON_DELETE: "false"
      HAPI_FHIR_ALLOW_MULTIPLE_DELETE: "true"
      HAPI_FHIR_REUSE_CACHED_SEARCH_RESULTS_MILLIS: "0"
      HAPI_FHIR_DEFAULT_PAGE_SIZE: "50"
      HAPI_FHIR_MAX_PAGE_SIZE: "200"
      # Full-text search backs the _content parameter the resource browser
      # uses, which is the friendliest thing to hand a student who does not
      # yet know each resource's search parameters.
      HAPI_FHIR_ADVANCED_HSEARCH_INDEXING: "false"

      # The Flutter applications are served from a different origin, so the
      # browser will refuse to talk to this server without CORS.
      HAPI_FHIR_CORS_ALLOWED_ORIGIN_PATTERNS: "*"
      HAPI_FHIR_CORS_ALLOW_CREDENTIALS: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://localhost:8080/fhir/metadata || exit 1
      interval: 15s
      timeout: 10s
      # HAPI builds its schema on first boot, which takes a couple of minutes.
      retries: 40
      start_period: 120s
    restart: unless-stopped

volumes:
  fhir-db-data:
